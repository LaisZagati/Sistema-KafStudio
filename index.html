<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAF Studio · Mensalidades</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KAF Studio">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Menu">
    <img class="side-logo" src="logo.svg" alt="KAF Studio Pilates">
    <nav class="side-nav" id="side-nav"></nav>
    <button class="side-alert" data-action="bell" type="button">
      <span class="ico" data-icon="bell"></span><span>Alertas</span><span class="badge" data-badge hidden></span>
    </button>
  </aside>

  <div class="main">
    <header class="topbar">
      <img class="top-logo" src="logo.svg" alt="KAF Studio Pilates">
      <button class="icon-btn bell" data-action="bell" type="button" aria-label="Alertas de pagamento">
        <span class="ico" data-icon="bell"></span><span class="badge" data-badge hidden></span>
      </button>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Navegação principal"></nav>
</div>

<div id="sheet-root" class="sheet-root"></div>
<div id="confirm-root" class="confirm-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="print-area" class="print-area"></div>
<input type="file" id="backup-file" accept="application/json,.json" hidden>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
